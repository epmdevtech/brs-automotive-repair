name: CI - Quality Gates & Build

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gates:
    name: Quality Gates (Lint, Test, Build & SDD)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Python (para gerador de rastreabilidade SDD)
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run linter (ESLint)
        run: bun run lint

      - name: Run unit and integration tests (Vitest)
        run: bun run test

      - name: Build client and SSR bundle
        run: bun run build

      - name: Verify Universal SDD Traceability Matrix
        run: |
          python3 scripts/generate_traceability.py
          if ! git diff --exit-code docs/traceability-matrix.md; then
            echo "::error::A matriz de rastreabilidade esta desatualizada ou com lacunas. Execute 'python3 scripts/generate_traceability.py' e inclua as alteracoes no commit."
            exit 1
          fi

  docker-validation:
    name: Docker Build Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build multi-stage Docker image
        run: docker build -t brs-web:ci .
