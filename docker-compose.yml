services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
    container_name: brs-reparacoes
    ports:
      - "${APP_PORT:-5210}:5210"
    volumes:
      - .:/app
      - brs_node_modules:/app/node_modules
      - /app/dist
    environment:
      - NODE_ENV=development
      - PORT=5210
      - HOST=0.0.0.0
      - CHOKIDAR_USEPOLLING=true
      - VITE_USE_POLLING=true
      - WATCHPACK_POLLING=true
      - CHOKIDAR_INTERVAL=100
      - APP_PORT=${APP_PORT:-5210}
    init: true
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'bun -e "fetch(''http://127.0.0.1:5210/'').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"',
        ]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  brs_node_modules:
